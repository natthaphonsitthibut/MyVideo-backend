[project]
name = "myvideo-ai"
version = "0.1.0"
description = "MyVideo internal AI service: VAD, ASR, shot detection, Thai tokenisation (internal network only)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.4",
    "uvicorn==0.54.0",
    "pydantic==2.14.3",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.4",
    "httpx2==2.16.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# tests run fixed local tools (ffmpeg) to prepare fixtures
"tests/*" = ["S603", "S607"]
# the service runs whisper.cpp binaries with argument lists (no shell)
"src/myvideo_ai/*.py" = ["S603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

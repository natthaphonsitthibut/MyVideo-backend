# Optional: PostgreSQL + Redis in Docker for local development.
# The default on the 8 GB dev machine is native services (workspace scripts/dev-services.sh).
# Use this on a machine with more memory, or on a server.
#   docker compose up -d        docker compose down        docker compose down -v   (also deletes data)
# With these containers use:
#   DATABASE_URL=postgresql://myvideo:myvideo@localhost:5432/myvideo_dev
#   TEST_DATABASE_URL=postgresql://myvideo:myvideo@localhost:5432/myvideo_test
#   REDIS_URL=redis://localhost:6379
name: myvideo
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: myvideo
      POSTGRES_PASSWORD: myvideo
      POSTGRES_DB: myvideo_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myvideo -d myvideo_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
volumes:
  pgdata:
  redisdata:
